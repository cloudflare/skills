name: Verify release version
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Match release tag to manifests and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/prepare-release.py "${RELEASE_TAG#v}"
